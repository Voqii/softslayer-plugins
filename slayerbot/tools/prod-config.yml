config:
  version: 1.4
  # How much should the length of the question asked by player match
  # with the questions in the database for the plugin to start checking for answers
  # 70 is quite okay, but if you're having problems with undetected questions, try lowering this to 60.
  lengthMatch: 65
  # How much should the words used in the question asked by the player match
  # with the question for the plugin to give the answer
  # Please note that, this plugin uses the technique known as 'Bag-of-Words', so
  # if a player misspells a word, or shortens it (I would = I'd), the matching percentage
  # will fall greatly, so there may be some undetected questions.
  # Also please know that 80 is basically 'quite certain' for the plugin to detect questions
  # however, if you'd like to lower this to 70, it would allow the plugin to detect questions
  # more easily BUT with more false-positives.
  questionsMatch: 80
  # If broadcast is true, then all the players online will see the answer given by the plugin
  # if it is false, then only the player who asked the question will see the answer.
  broadcast: true
  # {question} = returns the question matched in the database.
  # {newline} = continues in new line.
  # {answer} = returns the answer matched in the database.
  format: "&7[&2SlayerBot&7] &f{answer}"


