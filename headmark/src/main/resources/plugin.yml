name: HeadMark
version: 1.0.0
main: com.voqii.headmark.HeadMark
api-version: '1.21'
author: Voqii
description: Watermarks MoreMobHeads player heads dropped by kills in specific worlds.
depend: [MoreMobHeads]

commands:
  headmark:
    description: HeadMark admin commands.
    usage: /headmark reload

permissions:
  headmark.reload:
    description: Allows reloading the HeadMark config.
    default: op
